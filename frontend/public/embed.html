<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video-stream{display:block;width:100%;height:100%}
  video-stream .info{display:none!important}
  video-stream .mode{display:none!important}
  video-stream::part(mode){display:none!important}
  video-stream::part(label){display:none!important}
  video{width:100%!important;height:100%!important;object-fit:var(--fit,cover);background:#000}
  .stream-error{
    position:absolute;
    inset:0;
    z-index:3;
    display:grid;
    place-items:center;
    padding:24px;
    color:#edeae0;
    background:
      radial-gradient(circle at 50% 44%,rgba(255,176,32,.08),transparent 34%),
      #070709;
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .stream-error[hidden]{display:none}
  .stream-error-card{display:grid;justify-items:center;gap:9px;text-align:center}
  .stream-error-mark{
    position:relative;
    width:40px;
    height:40px;
    margin-bottom:5px;
    border:1px solid rgba(255,176,32,.35);
    border-radius:50%;
  }
  .stream-error-mark::before{
    content:"";
    position:absolute;
    inset:50% auto auto 50%;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ffb020;
    transform:translate(-50%,-50%);
    box-shadow:0 0 14px rgba(255,176,32,.7);
  }
  .stream-error-mark::after{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(255,176,32,.22);
    border-radius:50%;
    animation:signal 1.8s ease-out infinite;
  }
  .stream-error-label{color:#7a7a82;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .stream-error-title{font-size:14px;font-weight:600;letter-spacing:.02em}
  .stream-error-detail{max-width:360px;color:#b7b5ac;font-size:11px;line-height:1.55}
  @keyframes signal{0%{opacity:.8;transform:scale(.65)}80%,100%{opacity:0;transform:scale(1.7)}}
  /* Chromium: native Video-Chrome ausblenden (Video ist hier same-origin) */
  video::-webkit-media-controls,
  video::-webkit-media-controls-enclosure,
  video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none!important}
</style></head><body>
<script type="module">
  import { streamErrorPresentation } from '/embed-status.js';

  const p = new URLSearchParams(location.search);
  const src = p.get('src');
  const label = p.get('label') || 'Kamera';
  const mode = p.get('mode') || 'mse,mp4,mjpeg';
  let muted = true;
  document.documentElement.style.setProperty('--fit', p.get('fit') === 'contain' ? 'contain' : 'cover');
  if (src) {
    await import('/go2rtc/video-stream.js'); // registriert <video-stream> same-origin
    const el = document.createElement('video-stream');
    el.background = true;            // Stream nicht pausieren, wenn iframe versteckt
    el.muted = true;
    el.mode = mode;
    el.src = '/go2rtc/api/ws?src=' + encodeURIComponent(src);
    document.body.appendChild(el);

    const notice = document.createElement('div');
    notice.className = 'stream-error';
    notice.hidden = true;
    notice.setAttribute('role', 'status');
    notice.innerHTML = '<div class="stream-error-card"><div class="stream-error-mark" aria-hidden="true"></div><div class="stream-error-label"></div><div class="stream-error-title"></div><div class="stream-error-detail"></div></div>';
    notice.querySelector('.stream-error-label').textContent = label;
    document.body.appendChild(notice);

    // Native Controls cross-browser zuverlässig abschalten (auch Firefox):
    let readySent = false;
    const notifyReady = () => {
      if (readySent) return;
      readySent = true;
      notice.hidden = true;
      window.parent?.postMessage({ type: 'camera-stream-ready', src }, location.origin);
    };
    const syncErrorNotice = () => {
      const playerMode = el.querySelector?.('.mode')?.textContent?.trim().toLowerCase() || '';
      if (playerMode !== 'error') {
        if (readySent) notice.hidden = true;
        return;
      }
      const raw = el.querySelector?.('.status')?.textContent?.trim() || '';
      const presentation = streamErrorPresentation(raw);
      const title = notice.querySelector('.stream-error-title');
      const detail = notice.querySelector('.stream-error-detail');
      if (title.textContent !== presentation.title) title.textContent = presentation.title;
      if (detail.textContent !== presentation.detail) detail.textContent = presentation.detail;
      notice.hidden = false;
    };
    const strip = () => {
      const v = el.video || el.querySelector?.('video');
      if (v) {
        v.controls = false;
        v.muted = muted;
        v.removeAttribute('controls');
        v.style.pointerEvents = 'none';
        if (!muted) v.play?.().catch?.(() => undefined);
        if (v.readyState >= 2) notifyReady();
        v.addEventListener('loadeddata', notifyReady, { once: true });
        v.addEventListener('playing', notifyReady, { once: true });
      }
      for (const node of el.querySelectorAll?.('*') || []) {
        if (node.textContent?.trim() === 'MSE') node.style.display = 'none';
      }
      syncErrorNotice();
    };
    strip();
    new MutationObserver(strip).observe(document.body, { childList: true, subtree: true });
    window.addEventListener('message', (event) => {
      if (event.origin !== location.origin || event.data?.type !== 'camera-audio') return;
      muted = event.data.muted !== false;
      el.muted = muted;
      strip();
    });
  }
</script></body></html>
