<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video-stream{display:block;width:100%;height:100%}
  video-stream .info{display:none!important}
  video-stream .mode{display:none!important}
  video-stream::part(mode){display:none!important}
  video-stream::part(label){display:none!important}
  video{width:100%!important;height:100%!important;object-fit:var(--fit,cover);background:#000}
  .stream-error{
    position:absolute;
    inset:0;
    z-index:3;
    display:grid;
    place-items:center;
    padding:24px;
    color:#edeae0;
    background:
      radial-gradient(circle at 50% 44%,rgba(255,176,32,.08),transparent 34%),
      #070709;
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .stream-error[hidden]{display:none}
  .stream-error-card{display:grid;justify-items:center;gap:9px;text-align:center}
  .stream-error-mark{
    position:relative;
    width:40px;
    height:40px;
    margin-bottom:5px;
    border:1px solid rgba(255,176,32,.35);
    border-radius:50%;
  }
  .stream-error-mark::before{
    content:"";
    position:absolute;
    inset:50% auto auto 50%;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ffb020;
    transform:translate(-50%,-50%);
    box-shadow:0 0 14px rgba(255,176,32,.7);
  }
  .stream-error-mark::after{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(255,176,32,.22);
    border-radius:50%;
    animation:signal 1.8s ease-out infinite;
  }
  .stream-error-label{color:#7a7a82;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .stream-error-title{font-size:14px;font-weight:600;letter-spacing:.02em}
  .stream-error-detail{max-width:360px;color:#b7b5ac;font-size:11px;line-height:1.55}
  @keyframes signal{0%{opacity:.8;transform:scale(.65)}80%,100%{opacity:0;transform:scale(1.7)}}
  /* Chromium: native Video-Chrome ausblenden (Video ist hier same-origin) */
  video::-webkit-media-controls,
  video::-webkit-media-controls-enclosure,
  video::-webkit-media-controls-panel{display:none!important;-webkit-appearance:none!important}
</style></head><body>
<script type="module" src="/embed.js"></script></body></html>
