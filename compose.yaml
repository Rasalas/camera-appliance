services:
  agentdvr:
    image: mekayelanik/ispyagentdvr:stable
    container_name: agentdvr
    profiles:
      - agentdvr
    restart: unless-stopped
    ports:
      # DVR-Weboberfläche nur lokal exponieren; sie ist nicht für das LAN gedacht.
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/lib/camera-appliance/agentdvr/xml:/AgentDVR/Media/XML
      - /var/lib/camera-appliance/agentdvr/media:/AgentDVR/Media/WebServerRoot/Media
    depends_on:
      go2rtc:
        condition: service_healthy

  go2rtc:
    # Versionspin statt :latest – ein Upstream-Push darf die Appliance nicht
    # unbeabsichtigt verändern. Tag ohne "v"-Präfix; im Sync mit GO2RTC_VERSION
    # im Makefile halten.
    image: alexxit/go2rtc:${GO2RTC_IMAGE_TAG:-1.9.14}
    container_name: go2rtc
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1984/api/streams"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - /var/lib/camera-appliance/generated/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "127.0.0.1:1984:1984"
      - "127.0.0.1:8554:8554"

  camera-manager:
    build:
      context: .
      dockerfile: camera-manager/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: camera-manager
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      CAMERA_APPLIANCE_BIND_ADDR: 0.0.0.0:8091
      CAMERA_APPLIANCE_CONFIG_DIR: /etc/camera-appliance
      CAMERA_APPLIANCE_STATE_DIR: /var/lib/camera-appliance
      CAMERA_APPLIANCE_FRONTEND_DIST: /opt/camera-appliance/frontend/dist
    volumes:
      - /opt/camera-appliance:/opt/camera-appliance
      - /etc/camera-appliance:/etc/camera-appliance
      - /var/lib/camera-appliance:/var/lib/camera-appliance
      # Root-äquivalent: der Manager braucht den Socket nur für go2rtc-Restarts.
      # Alternative ohne Socket: CAMERA_APPLIANCE_GO2RTC_RESTART_COMMAND mit
      # deploy/nas/restart-go2rtc.sh (siehe docs/decisions).
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    ipam:
      config:
        - subnet: 10.250.0.0/24
