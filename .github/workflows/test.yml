name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: camera-manager/go.mod
          cache-dependency-path: camera-manager/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: go test -race ./...
        working-directory: camera-manager
      - run: go vet ./...
        working-directory: camera-manager
      - run: npm test && npm run build
        working-directory: frontend
