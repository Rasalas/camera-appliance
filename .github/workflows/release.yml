name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: camera-manager/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release archive
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          short_commit="${COMMIT:0:7}"
          make release VERSION="$version" COMMIT="$short_commit"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          short_commit="${COMMIT:0:7}"
          archive=".release/camera-appliance-${version}-${short_commit}.tar.gz"
          gh release create "$REF_NAME" \
            "$archive" \
            ".release/camera-appliance-latest.tar.gz" \
            --title "camera-appliance ${REF_NAME}" \
            --generate-notes \
            --latest
