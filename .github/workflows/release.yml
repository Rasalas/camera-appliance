name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: camera-manager/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release archive
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          short_commit="${COMMIT:0:7}"
          make release VERSION="$version" COMMIT="$short_commit"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          short_commit="${COMMIT:0:7}"
          archive=".release/camera-appliance-${version}-${short_commit}.tar.gz"
          previous_tag="$(git describe --tags --abbrev=0 "${COMMIT}^" 2>/dev/null || true)"
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          if [[ -n "$previous_tag" ]]; then
            git log --format='* %s ([%h](https://github.com/Rasalas/camera-appliance/commit/%H))' \
              "${previous_tag}..${COMMIT}" > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            printf '%s\n' 'No commit details available.' > "$notes_file"
          fi
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" \
              "$archive" \
              ".release/camera-appliance-latest.tar.gz" \
              --clobber
          else
            gh release create "$REF_NAME" \
              "$archive" \
              ".release/camera-appliance-latest.tar.gz" \
              --title "camera-appliance ${REF_NAME}" \
              --notes-file "$notes_file" \
              --generate-notes \
              --latest
          fi
